spring.application.name=api
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://localhost:5432/aira
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Migration drafts remain opt-in until an operator explicitly approves DB application.
spring.flyway.enabled=${FLYWAY_ENABLED:false}

aira.auth.argon2.salt-length=16
aira.auth.argon2.hash-length=32
aira.auth.argon2.parallelism=1
aira.auth.argon2.memory-kib=19456
aira.auth.argon2.iterations=2
aira.auth.session.cookie-secure=${AIRA_SESSION_COOKIE_SECURE:true}
aira.auth.session.cookie-same-site=Lax
aira.auth.recovery-email.encryption-key=${AIRA_RECOVERY_EMAIL_ENCRYPTION_KEY:}
aira.auth.recovery-email.lookup-key=${AIRA_RECOVERY_EMAIL_LOOKUP_KEY:}
aira.auth.recovery-email.key-version=${AIRA_RECOVERY_EMAIL_KEY_VERSION:1}
aira.auth.resend.api-key=${RESEND_API_KEY:}
aira.auth.resend.from=${RESEND_FROM_EMAIL:}
aira.auth.resend.public-base-url=${AIRA_PUBLIC_BASE_URL:}
aira.opendart.api-key=${OPENDART_API_KEY:}
aira.ecos.api-key=${BOK_ECOS_API_KEY:}
aira.krx.auth-key=${AIRA_KRX_AUTH_KEY:}

# Official KRX index refresh is live-network and opt-in only.
aira.krx.index-refresh.enabled=${AIRA_KRX_INDEX_REFRESH_ENABLED:false}
aira.krx.index-refresh.mode=${AIRA_KRX_INDEX_REFRESH_MODE:}

# Official KRX stock refresh is live-network and opt-in only.
aira.krx.stock-refresh.enabled=${AIRA_KRX_STOCK_REFRESH_ENABLED:false}
aira.krx.stock-refresh.mode=${AIRA_KRX_STOCK_REFRESH_MODE:}
aira.krx.stock-refresh.targets=${AIRA_KRX_STOCK_REFRESH_TARGETS:KOSPI:000660,KOSPI:035420}

# Daily scheduled refresh of official data (opt-in). The one-shot runners above only fire at boot;
# turn this on so the demo does not stay frozen on the day it was last restarted.
# Needs the same live-mode flags and API keys as the runners. Cron uses Asia/Seoul.
aira.refresh.scheduler.enabled=${AIRA_REFRESH_SCHEDULER_ENABLED:false}
aira.refresh.scheduler.cron=${AIRA_REFRESH_SCHEDULER_CRON:0 30 8,18 * * *}
aira.refresh.scheduler.opendart-cron=${AIRA_REFRESH_SCHEDULER_OPENDART_CRON:0 0 9 * * *}
aira.refresh.scheduler.ecos-cron=${AIRA_REFRESH_SCHEDULER_ECOS_CRON:0 0 10 * * *}
aira.refresh.scheduler.ecos-quarters=${AIRA_REFRESH_SCHEDULER_ECOS_QUARTERS:8}

# Official demo preparation is live-network and opt-in only. See docs/runbooks.
aira.demo.bootstrap.enabled=${AIRA_DEMO_BOOTSTRAP_ENABLED:false}
aira.demo.bootstrap.mode=${AIRA_DEMO_BOOTSTRAP_MODE:}
aira.demo.bootstrap.business-year=${AIRA_DEMO_BOOTSTRAP_BUSINESS_YEAR:2025}

# Personal-finance AI is opt-in. RULE analysis remains authoritative if provider is unavailable.
aira.ai.openai.enabled=${AIRA_AI_OPENAI_ENABLED:false}
aira.ai.openai.api-key=${OPENAI_API_KEY:}
aira.ai.openai.endpoint=${AIRA_AI_OPENAI_ENDPOINT:https://api.openai.com/v1/responses}
aira.ai.openai.model=${AIRA_AI_OPENAI_MODEL:gpt-5.6-luna}
